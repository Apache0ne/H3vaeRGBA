name: CPU preflight
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: cpu-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU testing requirements
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install pytest
          pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q h3rgba tools train_vae.py run_vae_22gb.py tests
      - name: Run CPU tests
        run: python -m pytest tests -q
